let actx = null;
function tone(seq){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    let t = actx.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'triangle'; o.frequency.value=f;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.start(t); o.stop(t+d); t+=d;
    });
  }catch(e){}
}
const sfx = {
  pop:()=>tone([[520,.07,'sine']]),
  ok:()=>tone([[523,.12],[659,.12],[784,.22]]),

  win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]])

function speak(t){
  if(!S.sound) return;
  try{

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,''));
    u.lang='id-ID'; u.rate=.85; speechSynthesis.speak(u);
  }catch(e){}
}

    case 'pilihan': t=m.hint+' '+q.text; break;
    case 'perasaan': t=q.situation; break;
    case 'spo': t='Tentukan subjek, predikat, dan objek. '+q.sentence; break;

function makeOpts(p){
  const a=p.a, base=a.toLowerCase();
  let c=CONF[base] || String.fromCharCode(((base.charCodeAt(0)-97+1)%26)+97);
  const d = a===a.toUpperCase() ? c.toUpperCase() : c.toLowerCase();
  return [...new Set([a,p.q,d])];
}
function initQ(){
  const m=gameData[S.materi], q=m.questions[S.idx];
  S.checked=false;
  switch(m.type){
    case 'kapital': S.cur={ ans:q.pairs.map(()=>null), opts:q.pairs.map(p=>shuffle(makeOpts(p))) }; break;
    case 'spo': S.cur={ slots:[null,null,null], sel:0,
        chips:shuffle([...q.words.map(w=>({id:w,label:w})),{id:'-',label:'(tidak ada)'}]) }; break;
    case 'susun': S.cur={ placed:[], pool:shuffle(q.words.map((w,i)=>({id:i,w}))) }; break;
    default: S.cur={ pick:null, opts:shuffle(q.options) };
  }
}
function ready(){
  const m=gameData[S.materi], c=S.cur;
  switch(m.type){
    case 'kapital': return c.ans.every(x=>x!==null);
    case 'spo': return c.slots.every(x=>x!==null);
    case 'susun': return c.placed.length===c.pool.length;
    default: return c.pick!==null;
  }
}
function check(){
  if(!ready()) return;
  const m=gameData[S.materi], q=m.questions[S.idx], c=S.cur; let ok=0,total=1;
  switch(m.type){
    case 'kapital': total=q.pairs.length; ok=q.pairs.filter((p,i)=>c.ans[i]===p.a).length; break;
    case 'spo': total=3; ok=(c.slots[0]===q.s)+(c.slots[1]===q.p)+(c.slots[2]===q.o); break;
    case 'susun': { const s=c.placed.map(id=>q.words[id]).join(' ')+'.'; ok = s===q.answer?1:0; break; }
    default: ok = c.opts[c.pick].isCorrect?1:0;
  }
  S.results[S.idx]={ok,total}; S.checked=true;
  (ok===total?sfx.ok:sfx.no)();
  render();
  const fbEl=document.getElementById('fb'); if(fbEl) setTimeout(()=>speak(fbEl.innerText),350);
  const fb=document.getElementById('fb'); if(fb) fb.scrollIntoView({behavior:'smooth',block:'center'});
}

function finish(){
  const tot=S.results.reduce((a,r)=>a+r.total,0), ok=S.results.reduce((a,r)=>a+r.ok,0);
  const pct=ok/tot, stars = pct>=.9?3:pct>=.6?2:1;
  best[S.materi]=Math.max(best[S.materi]||0,stars); save('pbi_best',best);
  S.final={ok,tot,stars}; S.screen='result'; sfx.win(); render(); window.scrollTo(0,0);
}

function marioMount(){
  const cv=document.getElementById('mcv'); if(!cv) return;
  const W=360,H=280,G=H-40,n=S.cur.opts.length;
  cv.width=W*2; cv.height=H*2;
  const ctx=cv.getContext('2d'); ctx.scale(2,2);
  M={ctx,W,H,G,x:W/2-14,y:G-36,vx:0,vy:0,w:28,h:36,ground:true,face:1,left:0,right:0,locked:false,t:0,
     blocks:S.cur.opts.map((o,i)=>({i,x:(W/n)*(i+.5)-28,y:G-36-62-56,w:56,h:56,bump:0,state:'idle'}))};
  let last=performance.now(), acc=0;
  (function loop(now){
    if(!M) return;
    acc=Math.min(acc+(now-last),100); last=now;
    while(acc>=16.67){ marioStep(); acc-=16.67; }
    marioDraw(); raf=requestAnimationFrame(loop);
  })(last);
}
function marioStep(){
  const m=M; m.t++;
  m.vx=(m.right-m.left)*3.4; if(m.vx) m.face=m.vx>0?1:-1;
  m.x=Math.max(0,Math.min(m.W-m.w,m.x+m.vx));
  const prevTop=m.y; m.vy+=.6; m.y+=m.vy;
  if(m.y>=m.G-m.h){ m.y=m.G-m.h; m.vy=0; m.ground=true; } else m.ground=false;
  m.blocks.forEach(b=>{ if(b.bump>0) b.bump--; });
  if(!m.locked) for(const b of m.blocks){
    if(m.vy<0 && prevTop>=b.y+b.h-1 && m.y<=b.y+b.h && m.x+m.w>b.x+4 && m.x<b.x+b.w-4){
      m.y=b.y+b.h; m.vy=1; b.bump=8; marioHit(b.i); break;
    }
  }
}
function marioHit(i){
  const o=S.cur.opts[i], ok=!!o.isCorrect, q=gameData[S.materi].questions[S.idx];
  S.cur.pick=i; S.checked=true; S.results[S.idx]={ok:ok?1:0,total:1}; M.locked=true;
  M.blocks.forEach(b=>{ if(S.cur.opts[b.i].isCorrect) b.state='good'; });
  if(!ok) M.blocks[i].state='bad';
  (ok?sfx.ok:sfx.no)();
  const last=S.idx===gameData[S.materi].questions.length-1;
  const head=ok?`🎉 ${PRAISE[S.idx%PRAISE.length]}, ${esc(S.name)}! Jawabanmu benar!`:`💪 Belum tepat. Jawaban yang benar: <b>${'ABC'[S.cur.opts.findIndex(x=>x.isCorrect)]}</b>`;
  const cls=ok?'bg-green-100 border-green-500 text-green-900':'bg-red-50 border-red-400 text-red-900';
  document.getElementById('mfb').innerHTML=`<div id="fb" role="status" aria-live="polite" class="p-4 rounded-2xl border-4 ${cls} bounce-in"><p class="text-xl font-bold mb-1">${head}</p><p class="text-lg leading-relaxed">${q.explanation}</p></div>
    <button onclick="nextMario()" class="btn-3d bg-blue-500 text-white w-full rounded-2xl py-4 text-2xl font-bold mt-4">${last?'LIHAT HASIL 🎉':'LANJUT ▶'}</button>`;
  const fb=document.getElementById('fb'); setTimeout(()=>speak(fb.innerText),350);
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function marioDraw(){
  const m=M, c=m.ctx;
  const g=c.createLinearGradient(0,0,0,m.H); g.addColorStop(0,'#7DD3FC'); g.addColorStop(1,'#E0F2FE');
  c.fillStyle=g; c.fillRect(0,0,m.W,m.H);
  c.fillStyle='rgba(255,255,255,.9)';
  [[50,50],[190,32],[300,68]].forEach(([x,y],k)=>{ const cx=(x+m.t*.15*(k+1))%(m.W+80)-40; c.beginPath(); c.ellipse(cx,y,26,12,0,0,7); c.ellipse(cx+16,y-6,18,12,0,0,7); c.fill(); });
  c.fillStyle='#A16207'; c.fillRect(0,m.G,m.W,m.H-m.G);
  c.fillStyle='#22C55E'; c.fillRect(0,m.G,m.W,8);
  c.strokeStyle='#78350F'; c.lineWidth=1;
  for(let x=0;x<m.W;x+=30){ c.strokeRect(x,m.G+8,30,16); c.strokeRect(x+15,m.G+24,30,16); }
  m.blocks.forEach(b=>{
    const y=b.y-(b.bump>0?Math.sin(b.bump/8*Math.PI)*8:0);
    c.fillStyle=b.state==='good'?'#4ADE80':b.state==='bad'?'#F87171':'#FACC15';
    c.fillRect(b.x,y,b.w,b.h);
    c.lineWidth=4; c.strokeStyle=b.state==='good'?'#166534':b.state==='bad'?'#991B1B':'#A16207'; c.strokeRect(b.x+2,y+2,b.w-4,b.h-4);
    c.fillStyle='#1E3A8A'; c.font='bold 30px Fredoka, sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(b.state==='good'?'✓':b.state==='bad'?'✗':'ABC'[b.i], b.x+b.w/2, y+b.h/2+2);
  });
  c.save(); c.translate(m.x+m.w/2,m.y+m.h/2); c.scale(m.face,1);
  c.font='34px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('🧒',0,0); c.restore();
}
document.addEventListener('keydown',e=>{
  if(!M) return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){ M.left=1; e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'){ M.right=1; e.preventDefault(); }
  else if(k==='ArrowUp'||k===' '||k==='w'){ mjump(); e.preventDefault(); }
});
document.addEventListener('keyup',e=>{
  if(!M) return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') M.left=0;
  else if(k==='ArrowRight'||k==='d') M.right=0;
});

/* ===================== TAMPILAN ===================== */
function stars(n){ return '⭐'.repeat(n)+'<span class="opacity-30">☆</span>'.repeat(3-n); }

function viewName(){
  return `<div class="flex flex-col items-center text-center fade-in pt-6">
    <div class="text-7xl mb-3 animate-bounce">🧒</div>
    <h2 class="text-3xl font-bold text-blue-600 heading-font mb-1">Halo! Aku Bimo.</h2>
    <p class="text-xl font-bold text-gray-600 mb-6">Siapa namamu?</p>
    <input id="inp-name" maxlength="20" value="${esc(S.name)}" placeholder="Tulis namamu di sini" autocomplete="off"
      onkeydown="if(event.key==='Enter')setName()"
      class="w-full max-w-sm text-center text-2xl font-bold rounded-2xl border-4 border-blue-300 p-4 mb-5 focus:outline-none focus:border-blue-500 bg-white text-blue-900">
    <button onclick="setName()" class="btn-3d bg-yellow-400 text-yellow-900 rounded-full px-8 py-4 text-2xl font-bold">Mulai Petualangan 🚀</button>
  </div>`;
}

function viewHome(){
  const keys=Object.keys(gameData);
  const done=keys.filter(k=>best[k]).length;
  return `<div class="fade-in">
    <div class="text-center mb-5">
      <h2 class="text-3xl font-bold text-blue-600 heading-font">Hai, ${esc(S.name)}! 👋</h2>
      <p class="text-lg font-bold text-gray-600">Pilih petualanganmu hari ini.</p>
      <p class="text-sm font-bold text-yellow-700 mt-1">Selesai: ${done} dari ${keys.length} materi</p>
    </div>
    <div class="flex flex-col gap-3">
      ${keys.map((k,i)=>`
        <div>
        <button onclick="startMateri('${k}')" class="btn-3d w-full bg-blue-500 text-white rounded-2xl p-4 flex items-center gap-4 text-left">
          <div class="bg-white text-blue-600 font-bold w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0">${i+1}</div>
          <div class="flex-1"><div class="text-lg font-bold leading-tight">${gameData[k].title}</div>
          <div class="text-base mt-1">${stars(best[k]||0)}</div></div>
        </button>
        ${MARIO_TYPES.includes(gameData[k].type)?`<button onclick="startMario('${k}')" class="btn-3d w-full mt-2 bg-red-500 text-white rounded-2xl px-4 py-2 text-lg font-bold">🍄 Main ala Mario: lompat &amp; sundul jawaban!</button>`:''}
        </div>`).join('')}
    </div>
    <p class="text-center mt-6"><button onclick="changeName()" class="text-blue-600 underline font-bold">Ganti nama</button></p>
  </div>`;
}

function optStyle(i){
  const o=S.cur.opts[i];
  if(!S.checked) return S.cur.pick===i ? 'bg-blue-100 border-blue-500 scale-[1.02]' : 'bg-white border-blue-200';
  if(o.isCorrect) return 'bg-green-100 border-green-500';
  if(S.cur.pick===i) return 'bg-red-100 border-red-400';
  return 'bg-gray-50 border-gray-200 opacity-60';
}
function badge(i){
  const o=S.cur.opts[i], L='ABC'[i];
  if(!S.checked) return `<div class="w-11 h-11 rounded-full flex items-center justify-center text-xl font-bold shrink-0 ${S.cur.pick===i?'bg-blue-500 text-white':'bg-blue-100 text-blue-800'}">${L}</div>`;
  if(o.isCorrect) return `<div class="w-11 h-11 rounded-full flex items-center justify-center text-2xl shrink-0 bg-green-500 text-white">✓</div>`;
  if(S.cur.pick===i) return `<div class="w-11 h-11 rounded-full flex items-center justify-center text-2xl shrink-0 bg-red-400 text-white">✗</div>`;
  return `<div class="w-11 h-11 rounded-full flex items-center justify-center text-xl font-bold shrink-0 bg-gray-300 text-gray-500">${L}</div>`;
}
function choiceList(textSize){
  return `<div class="flex flex-col gap-3 w-full">${S.cur.opts.map((o,i)=>`
    <button ${S.checked?'disabled':''} onclick="pick(${i})" class="w-full flex items-center gap-3 p-3 rounded-2xl border-4 text-left transition-all ${optStyle(i)}">
      ${badge(i)}<span class="${textSize} font-bold text-gray-800 flex-1">${o.text}</span>
    </button>`).join('')}</div>`;
}

function bodyKapital(q){
  return `<div class="flex flex-col gap-3">${q.pairs.map((p,pi)=>{
    const picked=S.cur.ans[pi];
    const row = S.checked ? (picked===p.a?'border-green-400 bg-green-50':'border-red-300 bg-red-50') : 'border-blue-200 bg-white';
    return `<div class="rounded-2xl border-4 ${row} p-2 sm:p-3 flex items-center gap-2 sm:gap-4">
      <div class="heading-font font-bold text-5xl w-12 sm:w-20 text-center text-blue-900">${p.q}</div>
      <div class="text-xl text-gray-400">➜</div>
      <div class="flex gap-2 flex-1 justify-end">${S.cur.opts[pi].map(o=>{
        let c='bg-white border-blue-200';
        if(!S.checked){ if(picked===o) c='bg-blue-100 border-blue-500'; }
        else if(o===p.a) c='bg-green-200 border-green-500';
        else if(picked===o) c='bg-red-200 border-red-400';
        else c='bg-gray-50 border-gray-200 opacity-50';
        return `<button ${S.checked?'disabled':''} onclick="pickLetter(${pi},'${o}')" class="heading-font font-bold text-3xl sm:text-4xl w-12 h-12 sm:w-16 sm:h-16 rounded-xl border-4 ${c}">${o}</button>`;
      }).join('')}</div>
      <div class="w-7 text-2xl text-center">${S.checked?(picked===p.a?'✅':'❌'):''}</div>
    </div>`;}).join('')}</div>`;
}
function bodyPilihan(q){
  return `<div class="bg-red-50 border-4 border-red-200 p-5 rounded-3xl mb-4 text-center">
      <p class="text-base text-gray-500 font-bold mb-1">Kalimat yang salah:</p>
      <h3 class="text-2xl sm:text-3xl font-bold text-red-600 heading-font">"${q.text}"</h3></div>
    <p class="text-center font-bold text-gray-600 mb-2">Pilih yang benar:</p>${choiceList('text-lg sm:text-xl')}`;
}
function bodyPerasaan(q){
  return `<div class="bg-blue-50 border-4 border-blue-300 p-5 rounded-3xl mb-4 text-center">
      <h3 class="text-xl sm:text-2xl font-bold text-blue-900 leading-relaxed">${q.situation}</h3></div>
    <div class="grid grid-cols-3 gap-3">${S.cur.opts.map((o,i)=>`
      <button ${S.checked?'disabled':''} onclick="pick(${i})" class="flex flex-col items-center p-3 rounded-2xl border-4 transition-all ${optStyle(i)}">
        <div class="text-5xl sm:text-6xl mb-2">${o.emoji}</div>
        <div class="text-base sm:text-xl font-bold text-gray-700">${o.text}</div>
        <div class="mt-1 text-lg">${S.checked && o.isCorrect?'✅':(S.checked && S.cur.pick===i?'❌':'')}</div>
      </button>`).join('')}</div>`;
}
function bodyMembaca(q){
  return `<div class="bg-yellow-50 p-4 rounded-3xl border-4 border-yellow-300 mb-4">
      <div class="flex items-center gap-2 mb-2 border-b-2 border-yellow-200 pb-1"><span class="text-2xl">📖</span><h3 class="text-lg font-bold text-yellow-900 heading-font">Teks Bacaan</h3></div>
      <p class="text-lg sm:text-xl text-gray-800 leading-relaxed font-semibold">${q.text}</p></div>
    <div class="bg-blue-600 text-white p-4 rounded-2xl mb-3"><p class="text-sm text-blue-200 font-bold uppercase">Pertanyaan</p>
      <h4 class="text-xl font-bold leading-tight">${q.q}</h4></div>${choiceList('text-lg')}`;
}
function bodySPO(q){
  const c=S.cur;
  const lab = id => id==='-' ? '(tidak ada)' : id;
  const target = [q.s,q.p,q.o];
  return `<div class="text-center mb-4"><h3 class="text-2xl sm:text-3xl font-bold text-blue-900 heading-font bg-white p-4 rounded-2xl border-2 border-dashed border-blue-300 inline-block">"${q.sentence}"</h3></div>
    <div class="grid grid-cols-3 gap-2 mb-4">${SLOTS.map((s,i)=>{
      const v=c.slots[i]; let st=`${s.bg} ${s.bd}`;
      if(!S.checked && c.sel===i && v===null) st=`bg-white border-yellow-400 ring-4 ring-yellow-200`;
      if(S.checked) st = v===target[i] ? 'bg-green-100 border-green-500' : 'bg-red-100 border-red-400';
      return `<button ${S.checked?'disabled':''} onclick="selSlot(${i})" class="rounded-2xl border-4 ${st} p-2 min-h-[120px] flex flex-col items-center justify-between text-center">
        <div><div class="heading-font text-3xl font-bold ${s.tx}">${s.k}</div><div class="text-xs font-bold ${s.tx}">${s.n}<br>(${s.h})</div></div>
        <div class="text-base sm:text-xl font-bold text-gray-800 min-h-[28px] break-words">${v!==null?lab(v):'<span class="text-gray-300">?</span>'}</div>
        ${S.checked && v!==target[i] ? `<div class="text-xs font-bold text-green-700">Jawaban: ${lab(target[i])}</div>`:''}
      </button>`;}).join('')}</div>
    <p class="text-center font-bold text-gray-600 mb-2">${S.checked?'':'Ketuk kotak, lalu ketuk katanya:'}</p>
    <div class="flex flex-wrap justify-center gap-2">${c.chips.map(ch=>{
      const used=c.slots.includes(ch.id);
      return `<button ${S.checked||used?'disabled':''} onclick="placeChip('${ch.id}')" class="bg-yellow-300 text-yellow-900 px-5 py-3 rounded-xl text-xl font-bold border-b-4 border-yellow-500 ${used?'opacity-30':''}">${ch.label}</button>`;}).join('')}</div>`;
}
function bodySusun(q){
  const c=S.cur;
  const frame = S.checked ? (S.results[S.idx].ok?'border-green-400 bg-green-50':'border-red-300 bg-red-50') : 'border-blue-300 bg-white';
  const usedIds=c.placed;
  return `<div class="rounded-3xl border-4 border-dashed ${frame} p-4 min-h-[110px] flex flex-wrap items-center justify-center gap-2 mb-4">
      ${c.placed.length? c.placed.map((id,pos)=>`<button ${S.checked?'disabled':''} onclick="removeWord(${pos})" class="bg-blue-500 text-white px-4 py-2 rounded-lg text-xl font-bold shadow">${q.words[id]}</button>`).join('')+'<span class="text-3xl font-bold text-blue-900">.</span>'
        : '<span class="text-xl text-gray-300 font-bold italic">Ketuk kata di bawah untuk menyusun...</span>'}
    </div>
    <div class="bg-gray-100 p-4 rounded-3xl border-4 border-dashed border-gray-300 flex flex-wrap justify-center gap-2">
      ${c.pool.map(x=>`<button ${S.checked||usedIds.includes(x.id)?'disabled':''} onclick="addWord(${x.id})" class="bg-white text-blue-800 px-4 py-2 rounded-lg text-xl font-bold shadow border-2 border-blue-200 ${usedIds.includes(x.id)?'opacity-20':''}">${x.w}</button>`).join('')}
    </div>
    ${!S.checked && c.placed.length ? `<p class="text-center mt-3"><button onclick="resetSusun()" class="text-orange-600 font-bold underline">🔄 Susun ulang</button></p>`:''}`;
}

function viewGame(){
  const m=gameData[S.materi], q=m.questions[S.idx], total=m.questions.length;
  const done=S.idx+(S.checked?1:0), pts=S.results.reduce((a,r)=>a+(r&&r.ok===r.total?1:0),0);
  let body='';
  switch(m.type){
    case 'kapital': body=bodyKapital(q); break; case 'pilihan': body=bodyPilihan(q); break;
    case 'perasaan': body=bodyPerasaan(q); break; case 'spo': body=bodySPO(q); break;
    case 'susun': body=bodySusun(q); break; case 'membaca': body=bodyMembaca(q); break;
  }
  const r=S.results[S.idx]; let fb='';
  if(S.checked){
    const all=r.ok===r.total, part=r.ok>0&&!all;
    const cls = all?'bg-green-100 border-green-500 text-green-900':part?'bg-yellow-100 border-yellow-500 text-yellow-900':'bg-red-50 border-red-400 text-red-900';
    const head = all?`🎉 ${PRAISE[S.idx%PRAISE.length]}, ${esc(S.name)}! Jawabanmu benar!`:part?`👍 Hampir! ${r.ok} dari ${r.total} sudah benar.`:`💪 Belum tepat. Yuk belajar dari jawabannya!`;
    let expl='';
    if(m.type==='susun') expl=`Susunan yang benar: <b>${q.answer}</b>`;
    else if(m.type==='kapital') expl='Setiap huruf kapital punya pasangan huruf kecil: '+q.pairs.map(p=>`<b>${p.a}</b> ↔ ${p.q}`).join(' &nbsp; ');
    else expl=q.explanation||q.expl;
    fb=`<div id="fb" role="status" aria-live="polite" class="mt-5 p-4 rounded-2xl border-4 ${cls} bounce-in"><p class="text-xl font-bold mb-1">${head}</p>${all&&m.type==='kapital'?'':`<p class="text-lg leading-relaxed">${expl}</p>`}</div>`;
  }
  const last=S.idx===total-1;
  const ctrl = S.checked
    ? `<button onclick="nextQ()" class="btn-3d bg-blue-500 text-white w-full rounded-2xl py-4 text-2xl font-bold mt-5">${last?'LIHAT HASIL 🎉':'LANJUT ▶'}</button>`
    : `<button onclick="check()" ${ready()?'':'disabled'} class="btn-3d bg-green-500 text-white w-full rounded-2xl py-4 text-2xl font-bold mt-5">PERIKSA ✔</button>`;
  return `<div class="fade-in">
    <div class="flex items-center justify-between mb-2 text-sm font-bold">
      <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Soal ${S.idx+1} / ${total}</span>
      <span class="text-center text-blue-700 heading-font text-base px-2">${m.title}</span>
      <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">⭐ ${pts}</span>
    </div>
    <div class="w-full h-3 bg-blue-100 rounded-full overflow-hidden mb-4"><div class="h-full bg-green-400 transition-all" style="width:${done/total*100}%"></div></div>
    <div class="flex items-start gap-3 mb-4">
      <div class="text-4xl">🧒</div>
      <div class="flex-1 bg-yellow-50 border-2 border-yellow-300 rounded-2xl rounded-tl-none px-4 py-2 text-lg font-bold text-gray-700">${(q.instruction||m.hint).replace(/Tulis/g,'Pilih')}</div>
      <button onclick="speakCurrent()" class="w-11 h-11 shrink-0 rounded-full bg-blue-100 text-2xl" aria-label="Dengarkan soal" title="Dengarkan soal">🔊</button>
    </div>
    ${body}${fb}${ctrl}
  </div>`;
}

function viewResult(){
  const f=S.final, m=gameData[S.materi];
  const wrong=S.results.map((r,i)=>r.ok<r.total?i+1:null).filter(Boolean);
  const keys=Object.keys(gameData), nxt=keys[keys.indexOf(S.materi)+1];
  const msg = f.stars===3?'Luar biasa!':f.stars===2?'Bagus sekali!':'Terus berlatih ya!';
  return `<div class="flex flex-col items-center text-center bounce-in pt-4">
    <div class="text-6xl mb-2">🎉</div>
    <h2 class="text-4xl font-bold text-blue-600 heading-font">${msg}</h2>
    <p class="text-xl font-bold text-gray-700 mt-2">${esc(S.name)}, kamu selesai:<br><span class="text-yellow-600">"${m.title}"</span></p>
    <div class="text-5xl my-4">${stars(f.stars)}</div>
    <div class="bg-white border-4 border-blue-200 rounded-2xl px-6 py-3 mb-3"><span class="text-3xl font-bold text-blue-700">${f.ok}</span><span class="text-xl font-bold text-gray-500"> dari ${f.tot} jawaban benar</span></div>
    ${wrong.length?`<p class="font-bold text-orange-700 mb-3">Soal nomor ${wrong.join(', ')} masih bisa dicoba lagi 💪</p>`:`<p class="font-bold text-green-700 mb-3">Semua jawabanmu benar! 🌟</p>`}
    <div class="flex flex-col gap-3 w-full max-w-sm">
      ${nxt?`<button onclick="startMateri('${nxt}')" class="btn-3d bg-green-500 text-white rounded-2xl py-3 text-xl font-bold">Materi berikutnya ▶</button>`:''}
      <button onclick="${S.mode==='mario'?'startMario':'startMateri'}('${S.materi}')" class="btn-3d bg-blue-500 text-white rounded-2xl py-3 text-xl font-bold">Ulangi materi 🔄</button>
      <button onclick="goHome()" class="btn-3d bg-yellow-400 text-yellow-900 rounded-2xl py-3 text-xl font-bold">Kembali ke menu 🏠</button>
    </div></div>`;
}

function render(){
  stopMario();
  $('#btn-home').classList.toggle('hidden', !(S.screen==='game'||S.screen==='result'||S.screen==='mario'));
  const m=$('#main');
  m.innerHTML = S.screen==='name'?viewName() : S.screen==='home'?viewHome() : S.screen==='game'?viewGame() : S.screen==='mario'?viewMario() : viewResult();
  if(S.screen==='mario') marioMount();
}

(function init(){
  S.name = load('pbi_name','');
  if(!Array.isArray(S.name)&&typeof S.name!=='string') S.name='';
  S.screen = S.name ? 'home' : 'name';
  render();
})();
</script>
